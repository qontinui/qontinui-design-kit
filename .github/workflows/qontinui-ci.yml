name: qontinui CI
# DO NOT DELETE THE `push:` TRIGGER, and do not narrow it past the branch list
# below. coord's merge train pushes `merge-candidate/<uuid>` and waits
# `awaiting-ci` for check-runs on that ref. A `pull_request`-only workflow can
# never satisfy it: the train times out at COORD_MERGE_CI_TIMEOUT (1800s),
# requeues forever, and permanently consumes one of COORD_MERGE_SLOTS
# (default 3). coord also judges "can this repo produce candidate CI?" purely on
# the PRESENCE of this `push:` key (`ci_baseline.rs`
# `is_candidate_check_producing_trigger` is branch-filter-blind by design), so
# deleting it trips AlertKind::MergeCandidateNoCiProducer.
#
# The three `merge-candidate*` prefixes are coord's authoritative list
# (`ci_observer.rs` CANDIDATE_BRANCH_PREFIXES_EXACT). Omitting one wedges the
# train. `main` must stay too: coord's head-baseline axis needs a `push`
# trigger that CAN fire on the default branch.
#
# WHY THIS IS SCOPED RATHER THAN THE `on: [push, pull_request]` IT REPLACED.
# An UNFILTERED `push:` also fired on every PR head branch, so every PR ran this
# workflow TWICE against the same head SHA - two runs of identical work
# competing for the same hosted-runner pool, and the PR pinned at
# mergeStateStatus=UNSTABLE until the slower duplicate drained. A `concurrency:`
# block does NOT fix it: `github.ref` differs by event (`refs/heads/<branch>` vs
# `refs/pull/<n>/merge`) so the two runs land in different groups - measured,
# qontinui-docs and qontinui-gym carry `cancel-in-progress: true` and still emit
# both runs at one SHA. Plan:
# 2026-08-31-devops-unfiltered-push-trigger-duplicates-every-pr-ci-run.
#
# `pull_request:` is deliberately left UNFILTERED so stacked PRs based on a
# long-lived integration branch still get CI.
on:
  push:
    branches:
      - main
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Phase 3's adapter test builds @qontinui/design-tokens at this sha from
      # the checkout below (offline of the network clone).
      DESIGN_TOKENS_REPO: ${{ github.workspace }}/.tokens-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: qontinui/qontinui-design-tokens
          ref: 415be4535ac4deae2201ed4601084b4a948eef10
          fetch-depth: 0
          path: .tokens-src
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      # Probe 3 and the Phase 5 state check drive the published
      # @qontinui/ui-bridge-wrapper door, which needs a browser.
      - name: Provision Chromium
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # The Phase 5 gate: the state check runs against the built specimen
      # through the published wrapper, and the generated guide is evaluated
      # over the same page (the first evaluator of a .styleguide.uibridge.json).
      - name: State check and guide validation on the built specimen
        run: |
          node dist/cli.js compile --out .specimen/design
          node dist/cli.js specimen --file .specimen/specimen.html
          node dist/cli.js check-states .specimen/specimen.html --file .specimen/state-coverage.json
          node dist/cli.js validate-guide .specimen/design/design-kit-specimen.styleguide.uibridge.json .specimen/specimen.html
      # The peer is a range (>=0.54.0 <1); the Test step above runs the 0.56.0
      # devDependency, this one the floor the range claims. It is LAST so no
      # other step runs on the floor install, and it restores with npm ci.
      - name: Test against the ui-bridge peer floor (0.54.0)
        run: |
          npm i --no-save @qontinui/ui-bridge@0.54.0
          installed="$(node -p "require('@qontinui/ui-bridge/package.json').version")"
          if [ "$installed" != "0.54.0" ]; then
            echo "::error::peer-floor leg expected @qontinui/ui-bridge 0.54.0, found '$installed'"
            exit 1
          fi
          npm test
          npm ci
